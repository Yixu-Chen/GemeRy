function place(x,y,radius=28){if(preview)return;let g=tapTarget(x,y,radius);if(!g||g.c!==selected||filled.has(g.id))return;filled.add(g.id);hover=0;save();update();if(filled.size===gems.length)$('done').showModal()}

const pointers=new Map();let gesture=null,gestureUsed=false,dragged=false,startPoint=null;
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function pair(){const [a,b]=[...pointers.values()];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))}}
function paintLine(a,b){const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/4));for(let i=0;i<=n;i++)place(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n)}
canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e);pointers.set(e.pointerId,p);if(pointers.size===1){gestureUsed=false;dragged=false;startPoint=p}else{gestureUsed=true;gesture=pair()}render()};
canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const old=pointers.get(e.pointerId),p=point(e);pointers.set(e.pointerId,p);if(pointers.size>=2){const next=pair();if(gesture){z(next.d/gesture.d,gesture.x,gesture.y);pan.x+=next.x-gesture.x;pan.y+=next.y-gesture.y}gesture=next}else if(!gestureUsed){if(dragged){pan.x+=p.x-old.x;pan.y+=p.y-old.y}else if(startPoint&&Math.hypot(p.x-startPoint.x,p.y-startPoint.y)>10){dragged=true;pan.x+=p.x-startPoint.x;pan.y+=p.y-startPoint.y}}render()};
function endPointer(e,cancelled=false){if(!pointers.has(e.pointerId))return;if(!cancelled&&!gestureUsed&&!dragged&&pointers.size===1&&startPoint&&Math.hypot(point(e).x-startPoint.x,point(e).y-startPoint.y)<=10){const p=point(e);place(p.x,p.y,e.pointerType==='mouse'?12:28)}pointers.delete(e.pointerId);gesture=null;if(!pointers.size)gestureUsed=false;render()}
canvas.onpointerup=e=>endPointer(e);canvas.onpointercancel=e=>endPointer(e,true);canvas.onlostpointercapture=e=>endPointer(e,true);canvas.oncontextmenu=e=>e.preventDefault();
window.addEventListener('blur',()=>{pointers.clear();gesture=null;gestureUsed=false});
function z(f,x=W/2,y=H/2){let prev=zoom;zoom=Math.max(1,Math.min(12,zoom*f));let r=zoom/prev;pan.x=(pan.x+W/2-x)*r+x-W/2;pan.y=(pan.y+H/2-y)*r+y-H/2;render()}
canvas.onwheel=e=>{e.preventDefault();z(e.deltaY<0?1.15:1/1.15,e.offsetX,e.offsetY)};$('plus').onclick=()=>z(1.4);$('minus').onclick=()=>z(1/1.4);$('home').onclick=()=>{zoom=1;pan={x:0,y:0};render()};$('move').onclick=()=>{moving=!moving;$('move').classList.toggle('active',moving)};
$('preview').onclick=()=>{preview=!preview;$('preview').textContent=preview?'返回镶嵌':'◈ 查看完成效果';render()};$('hint').onclick=()=>{let g=gems.find(g=>g.c===selected&&!filled.has(g.id));if(!g){$('toast').textContent='这一种宝石已完成';return}preview=false;$('preview').textContent='◈ 查看完成效果';zoom=Math.max(3,Math.min(8,20/(Math.min(g.rx,g.ry)*fit)));pan={x:-(g.x-IW/2)*fit*zoom,y:-(g.y-IH/2)*fit*zoom};hover=g.id;moving=false;$('move').classList.remove('active');render()};$('reset').onclick=()=>{if(confirm('清除这幅画的进度，重新开始？')){filled.clear();save();update();render()}};
new ResizeObserver(resize).observe(canvas);update();resize();let lastFrame=0;function loop(t){if(!document.hidden&&t-lastFrame>40){render(t);lastFrame=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);
