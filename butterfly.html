</style><header><b>✧ 拾光宝石</b><a href="index.html" style="color:#d8bd7c;text-decoration:none">← 全部作品</a></header><main><section class="stage"><canvas id="art"></canvas><div id="toast">选择宝石，再点击相同编号的空槽</div><div class="tools"><button id="minus">−</button><button id="home">⌖</button><button id="plus">＋</button><button id="move" title="拖动画布">✥</button></div></section><aside><small>GEM PORTRAIT / 003</small><h1>紫夜蝶翼</h1><p>放射翼纹 · 彩色宝石<br>每一颗宝石，都是画面的一笔。</p><div class="card"><div class="row"><span>你的闪耀进度</span><span id="pct">0%</span></div><div class="progress"><i id="bar"></i></div><small id="count"></small></div><div class="card"><div id="palette"></div><button id="preview" class="full">◈ 查看完成效果</button><button id="hint" class="full">✧ 找一颗</button><button id="reset" class="full">重新开始</button><p>按住划过可连续镶嵌。滚轮缩放；开启 ✥ 后拖动画布。进度自动保存。</p></div></aside></main><dialog id="done"><h2>紫夜蝶翼，因你闪耀</h2><p>每一颗宝石，都有自己的位置。</p><button onclick="this.parentNode.close()">欣赏作品</button></dialog><script>
const $=s=>document.getElementById(s),canvas=$('art'),ctx=canvas.getContext('2d');
const materials=[
 ['白水晶','#e1ecf5','round','圆形明亮式'],['乳白欧泊','#efe8d5','oval','椭圆弧面'],['月光石','#cad9df','pear','水滴弧面'],['蓝宝石','#164eab','step','长方阶梯式'],['黄水晶','#e5af2d','step','长方阶梯式'],['祖母绿','#087c59','ovalcut','椭圆刻面'],['粉碧玺','#d58a92','triangle','三角刻面'],['黄水晶','#e4b52e','heart','心形刻面'],['绿松石','#30a8af','marquise','马眼弧面'],['红宝石','#a91d55','round','圆形明亮式'],['蓝宝石','#205bb2','pear','水滴刻面'],['香槟水晶','#d4b36e','round','圆形明亮式']];
const gems=[],IW=900,IH=1200;let selected=0,preview=false,zoom=1,pan={x:0,y:0},moving=false,W=0,H=0,fit=1,hover=0;
function vertices(shape){let v=[];if(shape==='step')return[[-.72,-1],[.72,-1],[1,-.72],[1,.72],[.72,1],[-.72,1],[-1,.72],[-1,-.72]];if(shape==='triangle')return[[-1,-.65],[1,-.65],[0,1]];for(let i=0;i<48;i++){let t=i/48*Math.PI*2;if(shape==='heart')v.push([Math.pow(Math.sin(t),3),-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17]);else if(shape==='pear')v.push([Math.sin(t)*(.74+.26*Math.cos(t)),Math.cos(t)]);else if(shape==='marquise')v.push([Math.sin(t)*Math.abs(Math.sin(t)),Math.cos(t)]);else v.push([Math.sin(t),Math.cos(t)])}return v}
materials.push(['黑曜石','#151b25','round','圆形刻面']);const shapes=materials.map(m=>vertices(m[2]));
function path(v,s=1){const p=new Path2D();v.forEach(([x,y],i)=>i?p.lineTo(x*s,y*s):p.moveTo(x*s,y*s));p.closePath();return p}
const paths=shapes.map(v=>path(v));
function add(x,y,size,c,angle=0){const ratio={round:1,oval:.67,pear:.61,step:.78,ovalcut:.65,triangle:1,heart:1,marquise:.48}[materials[c][2]],rx=size*ratio/2,ry=size/2,a=angle*Math.PI/180;let ca=Math.cos(a),sa=Math.sin(a);const v=shapes[c].map(([u,v])=>[x+u*rx*ca-v*ry*sa,y+u*rx*sa+v*ry*ca]);let b=[Math.min(...v.map(p=>p[0])),Math.min(...v.map(p=>p[1])),Math.max(...v.map(p=>p[0])),Math.max(...v.map(p=>p[1]))];
 for(const g of gems){if(b[0]>g.b[2]+1||b[2]<g.b[0]-1||b[1]>g.b[3]+1||b[3]<g.b[1]-1)continue;let separated=false;for(const poly of [v,g.v]){for(let j=0;j<poly.length;j+=poly.length>12?4:1){const q=poly[j],r=poly[(j+1)%poly.length],nx=-(r[1]-q[1]),ny=r[0]-q[0],l=Math.hypot(nx,ny),a1=v.map(p=>(p[0]*nx+p[1]*ny)/l),a2=g.v.map(p=>(p[0]*nx+p[1]*ny)/l);if(Math.max(...a1)+1<Math.min(...a2)||Math.max(...a2)+1<Math.min(...a1)){separated=true;break}}if(separated)break}if(!separated)return false}
 gems.push({id:gems.length+1,x,y,rx,ry,a,c,v,b});return true}
function curve(points,size,c,spacing=size+2){let carry=0;for(let k=1;k<points.length;k++){let A=points[k-1],B=points[k],len=Math.hypot(B[0]-A[0],B[1]-A[1]);for(let d=carry;d<len;d+=spacing){let t=d/len;add(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,size,c,-Math.atan2(B[0]-A[0],B[1]-A[1])*180/Math.PI)}carry=(carry-len)%spacing;if(carry<0)carry+=spacing}}
function bez(p,n=100){let out=[];for(let i=0;i<=n;i++){let t=i/n,u=1-t;out.push([u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]])}return out}
function inside(x,y,poly){let on=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])on=!on}return on}





// Arc-length sampled strokes: gem orientation and scale follow the drawing.
function stroke(p,c,size=15){let carry=0,total=0;const ls=p.slice(1).map((v,i)=>Math.hypot(v[0]-p[i][0],v[1]-p[i][1]));const length=ls.reduce((a,b)=>a+b,0);for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],l=ls[i-1];while(carry<l){let t=carry/l,u=(total+carry)/length,s=typeof size==='function'?size(u):size;add(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,s,c,-Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI);carry+=s+2}carry-=l;total+=l}}
function B(p){return bez(p,160)}
function ribbon(a,b,cols,rows=7){let A=B(a),Bv=B(b);for(let j=0;j<rows;j++){let t=j/(rows-1);stroke(A.map((v,i)=>[v[0]*(1-t)+Bv[i][0]*t,v[1]*(1-t)+Bv[i][1]*t]),cols[Math.floor(t*cols.length)%cols.length],u=>10+9*Math.sin(Math.PI*u))}}

add(450,552,32,9);stroke(B([[450,580],[438,655],[467,729],[450,790]]),11,u=>24-16*u);
for(const s of [-1,1]){const P=p=>p.map(([x,y])=>[450+s*x,y]);
 const top=P([[8,570],[125,440],[320,140],[340,300]]),bottom=P([[12,630],[170,730],[380,550],[340,300]]);
 stroke(B(top),11,9);stroke(B(bottom),11,9);
 ribbon(top,bottom,[10,10,2,2,9,9,1,1],19);
 const low=P([[12,647],[220,610],[340,810],[170,1000]]),inner=P([[14,660],[35,740],[45,1005],[170,1000]]);
 stroke(B(low),11,8);stroke(B(inner),11,8);ribbon(low,inner,[9,9,2,2,10,10,1],13);
 for(let k=0;k<3;k++)stroke(B(P([[24,605+k*19],[95,535+k*35],[228,435+k*45],[320-k*14,345+k*43]])),11,7);
 stroke(B(P([[7,541],[26,480],[79,460],[75,421]])),11,7);add(450+s*75,421,14,1);
 stroke(B(P([[150,934],[115,1040],[230,1070],[241,987]])),2,u=>7+9*Math.sin(Math.PI*u));
}
add(450,552,32,9);stroke(B([[450,580],[438,655],[467,729],[450,790]]),11,u=>24-16*u);
const key='gallery-butterfly-flow-2';let filled=new Set;try{filled=new Set(JSON.parse(localStorage.getItem(key)||'[]').filter(id=>id>0&&id<=gems.length))}catch{}
function rgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}function tone(hex,f){return 'rgb('+rgb(hex).map(v=>Math.round(f>=0?v+(255-v)*f:v*(1+f))).join(',')+')'}
const sprites=materials.map((m,c)=>{let b=document.createElement('canvas');b.width=b.height=160;let q=b.getContext('2d');q.translate(80,80);q.scale(69,69);q.fillStyle=m[1];q.fill(paths[c]);q.save();q.clip(paths[c]);let grad=q.createLinearGradient(-1,-1,1,1);grad.addColorStop(0,tone(m[1],.7));grad.addColorStop(.3,m[1]);grad.addColorStop(.66,tone(m[1],-.45));grad.addColorStop(1,tone(m[1],.2));q.fillStyle=grad;q.fillRect(-1,-1,2,2);
 let cab=['oval','marquise'].includes(m[2])||c===2;
 if(cab){let g=q.createRadialGradient(-.3,-.4,.02,0,0,1.15);g.addColorStop(0,'#ffffffab');g.addColorStop(.35,'#ffffff15');g.addColorStop(.7,'#ffffff00');g.addColorStop(1,'#00000077');q.fillStyle=g;q.fillRect(-1,-1,2,2);if(c===1||c===2){for(let k=0;k<5;k++){let x=Math.sin(k*3)*.5,y=Math.cos(k*4)*.6,g=q.createRadialGradient(x,y,0,x,y,.5);g.addColorStop(0,['#8dd9e239','#ffe0b750','#c4bfff40'][k%3]);g.addColorStop(1,'#ffffff00');q.fillStyle=g;q.fillRect(-1,-1,2,2)}}}
 else{let v=shapes[c],step=v.length>12?4:1;for(let j=0;j<v.length;j+=step){let a=v[j],b=v[(j+step)%v.length];q.beginPath();q.moveTo(...a);q.lineTo(...b);q.lineTo(b[0]*.52,b[1]*.52);q.lineTo(a[0]*.52,a[1]*.52);q.closePath();q.fillStyle=tone(m[1],Math.cos(j*1.7)*.42);q.fill();q.strokeStyle='#ffffff22';q.lineWidth=.012;q.stroke()}q.fillStyle=tone(m[1],.12);q.fill(path(v,.52));q.strokeStyle='#ffffff77';q.lineWidth=.012;q.stroke(path(v,.52))}
 q.restore();q.strokeStyle=tone(m[1],.65);q.lineWidth=.025;q.stroke(paths[c]);q.beginPath();q.ellipse(-.32,-.5,.22,.07,-.5,0,Math.PI*2);q.fillStyle='#ffffffb0';q.fill();return b});
function render(t=performance.now()){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2+pan.x,H/2+pan.y);ctx.scale(fit*zoom,fit*zoom);ctx.translate(-IW/2,-IH/2);
 for(const g of gems){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.a);ctx.scale(g.rx,g.ry);const done=preview||filled.has(g.id);if(done){ctx.drawImage(sprites[g.c],-1.16,-1.16,2.32,2.32);ctx.save();ctx.clip(paths[g.c]);let v=Math.sin(t/2400+g.id*2.4),gr=ctx.createLinearGradient(v-.6,-1,v+.6,1);gr.addColorStop(0,'#ffffff00');gr.addColorStop(.5,'#ffffff35');gr.addColorStop(1,'#ffffff00');ctx.fillStyle=gr;ctx.fillRect(-1,-1,2,2);ctx.restore()}else{ctx.fillStyle=g.c===selected?'#53462d':'#19222b';ctx.fill(paths[g.c]);ctx.strokeStyle=g.c===selected?'#b8a06a':'#3a4651';ctx.lineWidth=1.1/Math.min(g.rx,g.ry);ctx.stroke(paths[g.c])}ctx.restore();if(!done&&(g.c===selected||zoom>3)&&Math.min(g.rx,g.ry)*fit*zoom>6){ctx.fillStyle=g.c===selected?'#ffe8ac':'#939da7';ctx.font='500 '+Math.min(12,Math.max(4,g.rx*.9))+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(g.c+1,g.x,g.y)}if(g.id===hover&&!done){ctx.strokeStyle='#ffe2a0';ctx.lineWidth=2/(fit*zoom);ctx.beginPath();ctx.arc(g.x,g.y,Math.max(g.rx,g.ry)+6,0,Math.PI*2);ctx.stroke()}}
 ctx.restore()}
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);fit=Math.min((W-24)/IW,(H-78)/IH);render()}
function update(){let n=filled.size;$('pct').textContent=Math.floor(n/gems.length*100)+'%';$('bar').style.width=n/gems.length*100+'%';$('count').textContent=n+' / '+gems.length+' 颗宝石';document.querySelectorAll('.mat').forEach(b=>{const c=Number(b.dataset.material);let remain=gems.filter(g=>g.c===c&&!filled.has(g.id)).length;b.classList.toggle('active',c===selected);b.querySelector('em').textContent=remain?'剩 '+remain+' 颗':'已完成';})}
const usedMaterials=new Set(gems.map(g=>g.c));selected=usedMaterials.has(selected)?selected:gems[0].c;
materials.forEach((m,c)=>{if(!usedMaterials.has(c))return;let b=document.createElement('button');b.className='mat';b.dataset.material=String(c);b.innerHTML='<img src="'+sprites[c].toDataURL()+'"><span>'+(c+1)+' '+m[0]+'<small style="display:block;font-size:8px;letter-spacing:0">'+m[3]+'</small><em></em></span>';b.title=m[3];b.onclick=()=>{selected=c;hover=0;update();render()};$('palette').append(b)});
function save(){try{localStorage.setItem(key,JSON.stringify([...filled]))}catch{}}
function hit(x,y){let p={x:(x-W/2-pan.x)/(fit*zoom)+IW/2,y:(y-H/2-pan.y)/(fit*zoom)+IH/2};return gems.find(g=>p.x>=g.b[0]&&p.x<=g.b[2]&&p.y>=g.b[1]&&p.y<=g.b[3]&&inside(p.x,p.y,g.v))}
function place(x,y){if(preview)return;let g=hit(x,y);if(!g||g.c!==selected||filled.has(g.id))return;filled.add(g.id);hover=0;save();update();if(filled.size===gems.length)$('done').showModal()}
let last=null;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);last={x:e.offsetX,y:e.offsetY};if(!moving)place(last.x,last.y)};canvas.onpointermove=e=>{if(!last)return;let p={x:e.offsetX,y:e.offsetY};if(moving){pan.x+=p.x-last.x;pan.y+=p.y-last.y}else{let steps=Math.max(1,Math.ceil(Math.hypot(p.x-last.x,p.y-last.y)/4));for(let i=1;i<=steps;i++)place(last.x+(p.x-last.x)*i/steps,last.y+(p.y-last.y)*i/steps)}last=p;render()};canvas.onpointerup=canvas.onpointercancel=()=>last=null;
function z(f,x=W/2,y=H/2){let prev=zoom;zoom=Math.max(1,Math.min(12,zoom*f));let r=zoom/prev;pan.x=(pan.x+W/2-x)*r+x-W/2;pan.y=(pan.y+H/2-y)*r+y-H/2;render()}
canvas.onwheel=e=>{e.preventDefault();z(e.deltaY<0?1.15:1/1.15,e.offsetX,e.offsetY)};$('plus').onclick=()=>z(1.4);$('minus').onclick=()=>z(1/1.4);$('home').onclick=()=>{zoom=1;pan={x:0,y:0};render()};$('move').onclick=()=>{moving=!moving;$('move').classList.toggle('active',moving)};
$('preview').onclick=()=>{preview=!preview;$('preview').textContent=preview?'返回镶嵌':'◈ 查看完成效果';render()};$('hint').onclick=()=>{let g=gems.find(g=>g.c===selected&&!filled.has(g.id));if(!g){$('toast').textContent='这一种宝石已完成';return}preview=false;$('preview').textContent='◈ 查看完成效果';zoom=Math.max(3,Math.min(8,20/(Math.min(g.rx,g.ry)*fit)));pan={x:-(g.x-IW/2)*fit*zoom,y:-(g.y-IH/2)*fit*zoom};hover=g.id;moving=false;$('move').classList.remove('active');render()};$('reset').onclick=()=>{if(confirm('清除这幅画的进度，重新开始？')){filled.clear();save();update();render()}};
new ResizeObserver(resize).observe(canvas);update();resize();let lastFrame=0;function loop(t){if(!document.hidden&&t-lastFrame>40){render(t);lastFrame=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
