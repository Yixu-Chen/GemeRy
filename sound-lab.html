<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>镶嵌音效试听</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#f5e8ce;font:16px system-ui}main{max-width:760px;margin:auto;padding:40px 20px}h1{font-size:28px}p{color:#b5becc;line-height:1.8}.card{background:#1b2636;border:1px solid #3a495b;border-radius:20px;padding:22px;margin:18px 0}h2{font-size:20px;margin:0}button,a{font:inherit;border-radius:12px;border:1px solid #c3a673;background:#c3a673;color:#17202d;padding:13px 18px;cursor:pointer;display:inline-block;text-decoration:none;margin:6px 8px 0 0}button.secondary{background:transparent;color:#eadbbb}label{display:block;margin:18px 0}input{width:220px;vertical-align:middle}small{color:#9eacbd}#status{min-height:28px}</style><main><a class="secondary" href="index.html">← 返回游戏</a><h1>选一个点钻的声音</h1><p>三种重新设计的短音效，每种可以单次试听，也可以听连续镶嵌的感觉。均为合成试听，并非《神庙逃亡》原声。</p><label>音量 <input id="volume" type="range" min="0" max="1" step=".01" value=".35"></label><div class="card"><h2>A · 清脆金币</h2><p>单下金属“叮”，起音明确、收尾很短，无双音提示旋律。</p><button onclick="play(0)">▶ 听一颗</button><button class="secondary" onclick="play(0,true)">▶ 连续收集</button></div><div class="card"><h2>B · 吃豆咔啵</h2><p>低一点、有颗粒感的“啵”，更偏街机吃豆，连续听有节奏。</p><button onclick="play(1)">▶ 听一颗</button><button class="secondary" onclick="play(1,true)">▶ 连续收集</button></div><div class="card"><h2>C · 硬币落袋</h2><p>短小的“咔叮”，敲击感更实，金属音更轻。</p><button onclick="play(2)">▶ 听一颗</button><button class="secondary" onclick="play(2,true)">▶ 连续收集</button></div><button class="secondary" onclick="stop()">停止试听</button><p id="status" aria-live="polite"></p><small>选好后告诉我 A、B 或 C，也可以说“用 A，但更低、更短”。当前游戏音效暂未更换。</small></main><script>
let ac,master,buffers=[],sources=[];
function init(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);for(let kind=0;kind<3;kind++){let length=[.105,.085,.095][kind],buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*length),ac.sampleRate),d=buf.getChannelData(0),phase=0,noise=0;for(let i=0;i<d.length;i++){let t=i/ac.sampleRate,u=t/length,env=Math.min(1,t/.0015)*Math.min(1,(length-t)/.008),v;noise=.4*noise+.6*(Math.random()*2-1);if(kind===0){v=(Math.sin(2*Math.PI*2050*t)+.32*Math.sin(2*Math.PI*3210*t)+.16*Math.sin(2*Math.PI*4540*t))*Math.exp(-t*44)*.52}else if(kind===1){phase+=2*Math.PI*(750-490*u)/ac.sampleRate;v=(Math.sin(phase)+.22*Math.sin(phase*3))*Math.exp(-t*29)*.65}else{v=.50*Math.sin(2*Math.PI*530*t)*Math.exp(-t*90)+.30*Math.sin(2*Math.PI*2450*t)*Math.exp(-t*60)+noise*.26*Math.exp(-t*160)}d[i]=v*env}buffers.push(buf)}}
function stop(){for(const s of sources){try{s.stop()}catch{}}sources=[]}
async function play(k,sequence=false){try{init();await ac.resume();stop();master.gain.value=Number(document.getElementById('volume').value);const times=sequence?[0,.27,.52,.75,.95,1.13,1.3,1.46]:[0];for(const delay of times){const s=ac.createBufferSource();s.buffer=buffers[k];s.connect(master);s.start(ac.currentTime+delay);sources.push(s);s.onended=()=>s.disconnect()}document.getElementById('status').textContent='正在试听 '+['A · 清脆金币','B · 吃豆咔啵','C · 硬币落袋'][k]}catch{document.getElementById('status').textContent='无法播放，请检查浏览器声音权限。'}}document.getElementById('volume').oninput=e=>{if(master)master.gain.value=Number(e.target.value)};
</script></html>
