<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无音调闪粉音效试听</title><style>body{margin:0;background:#101722;color:#f3e6cb;font:16px system-ui}main{max-width:650px;margin:auto;padding:28px 18px}a{color:#e7c582}section{background:#1c2737;border-radius:18px;padding:20px;margin:18px 0}h2{font-size:20px}audio{width:100%}p{line-height:1.8;color:#b7c1ce}.note{background:#24344a;padding:12px 15px;border-radius:12px}</style><main><a href="index.html">← 返回游戏</a><h1>闪粉沙沙声＋B款落位声</h1><p class="note">三段都保留你选中的 B 款固定声。闪烁部分已改为没有明确音高的细碎颗粒声，模拟轻轻摇晃闪粉盒。当前游戏音效尚未替换。</p><section><h2>1 · 细腻闪粉</h2><p>颗粒最细、最轻，声音连成柔和的闪动。</p><audio controls preload="metadata" playsinline src="audio-options/shimmer-1.wav"></audio><p><a href="audio-options/shimmer-1.wav">直接打开音频 1</a></p></section><section><h2>2 · 清脆晶砂</h2><p>颗粒更分明，像细小水晶砂在盒中滑动。</p><audio controls preload="metadata" playsinline src="audio-options/shimmer-2.wav"></audio><p><a href="audio-options/shimmer-2.wav">直接打开音频 2</a></p></section><section><h2>3 · 柔和亮片</h2><p>更轻、更松散，尾巴稍长，没有金属音高。</p><audio controls preload="metadata" playsinline src="audio-options/shimmer-3.wav"></audio><p><a href="audio-options/shimmer-3.wav">直接打开音频 3</a></p></section><p id="status" role="status"></p></main><script>const players=[...document.querySelectorAll('audio')];for(const a of players){a.volume=.78;a.addEventListener('play',()=>{for(const b of players)if(b!==a)b.pause()});a.addEventListener('error',()=>{document.getElementById('status').textContent='音频未加载，请点“直接打开音频”，或刷新页面后重试。'})}</script></html>
